<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8FAFC]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden — FYP Budget Management</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-[#F8FAFC]">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-100 shadow-xl text-center space-y-6">
        
        <!-- Shield Icon with Red Accent -->
        <div class="mx-auto w-20 h-20 rounded-3xl bg-rose-50 border border-rose-200/60 flex items-center justify-center text-rose-600 shadow-sm">
            <i data-lucide="shield-alert" class="w-10 h-10"></i>
        </div>

        <!-- Error Heading -->
        <div class="space-y-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider bg-rose-100 text-rose-800 border border-rose-200">
                HTTP 403 Forbidden
            </span>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Access Denied</h1>
            <p class="text-xs sm:text-sm text-slate-500 font-medium leading-relaxed">
                You do not have permission to view or retrieve this resource. This administrative log module is strictly restricted to accounts with the <strong class="text-slate-800 font-bold">'admin'</strong> role.
            </p>
        </div>

        <!-- Action Links -->
        <div class="pt-2 space-y-2.5">
            <a href="{{ url_for('dashboard') }}" class="w-full inline-flex items-center justify-center gap-2 py-3 px-5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-lg shadow-blue-600/30 transition-all cursor-pointer">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Return to Dashboard</span>
            </a>
            <a href="{{ url_for('admin_login') }}" class="w-full inline-flex items-center justify-center gap-2 py-3 px-5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border border-slate-200/60 transition-all cursor-pointer">
                <i data-lucide="lock" class="w-4 h-4"></i>
                <span>Switch to Admin Login</span>
            </a>
        </div>

        <!-- Footnote -->
        <p class="text-[11px] text-slate-400 font-medium">
            Role-Based Access Control (RBAC) enforced by FYP Budget Management.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
